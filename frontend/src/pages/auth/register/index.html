<!doctype html><html><head><meta charset="UTF-8"><title>Registro</title>
    <link rel="stylesheet" href="/src/style.css"></head><body>
<form id="form" class="card auth-form">
    <h2>Registro</h2>
    <input id="nombre" placeholder="Nombre" required>
    <input id="apellido" placeholder="Apellido" required>
    <input id="mail" type="email" placeholder="Email" required>
    <input id="celular" placeholder="Celular" required>
    <input id="pass" type="password" placeholder="Contraseña" required>
    <button>Registrarme</button>
    <p id="error" class="error"></p>
    <a href="../login/index.html">Ya tengo cuenta</a>
</form>
<script type="module" src="./register.ts"></script>
</body></html>
