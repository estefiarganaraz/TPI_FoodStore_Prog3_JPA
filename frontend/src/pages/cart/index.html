<!doctype html><html><head><meta charset="UTF-8"><title>Carrito</title>
    <link rel="stylesheet" href="/src/style.css"></head><body>
<header>
    <h1 style="color:#e85a4f;font-size:1.3rem">🍔Food Store</h1>
    <nav>
        <a href="../store/home/index.html">Tienda</a>
        <a href="../client/orders/index.html">Mis Pedidos</a>
        <a href="index.html">🛒 Carrito (<span id="badge">0</span>)</a>
    </nav>
</header>
<main style="max-width:900px;margin:2rem auto;padding:0 1rem">
    <h2 style="margin-bottom:1rem">Mi Carrito</h2>
    <div id="items"></div>
    <div id="summary" class="summary" style="display:none">

        <button id="vaciar" class="danger" style="width:100%;margin-top:.5rem">Vaciar Carrito</button>
